<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Админка — Onyx Ink</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
.box{max-width:420px;margin:15vh auto;padding:0 1.25rem}.box h1{font-size:2.2rem;margin-bottom:2rem}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:1rem;padding:.8rem 1.25rem;background:rgba(10,10,11,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .logo{font:1.1rem var(--ff);letter-spacing:.2em;margin-right:auto}.bar .logo i{font-style:normal;color:var(--gold)}#st{font-size:.8rem;color:var(--mut)}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;padding:1.25rem}.tabs button{background:none;border:1px solid var(--line);color:var(--mut);padding:.6rem 1.1rem;font:.75rem var(--fs);letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
.tabs button[aria-pressed=true]{border-color:var(--gold);color:var(--tx)}
#pane{padding:0 1.25rem 4rem;max-width:1100px}.fm{max-width:none}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr)) auto;gap:.8rem;align-items:end;padding:1.2rem 0;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:.8rem .5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--gold);font:.7rem var(--fs);letter-spacing:.15em;text-transform:uppercase}
</style>
</head>
<body>
<div id="login" class="box"><h1>Вход</h1><form id="lf" class="fm"><label>Пароль<input type="password" id="pw" autocomplete="current-password" required></label><button class="btn" type="submit">Войти</button><p class="ok" id="le" role="alert"></p></form></div>
<div id="app" hidden>
<header class="bar"><span class="logo">ONYX<i>INK</i> · Админка</span><span id="st" role="status"></span><button class="btn btn--s" id="save" type="button">Сохранить</button><button class="btn btn--s btn--g" id="out" type="button">Выйти</button></header>
<nav class="tabs" id="tabs"></nav><div id="pane"></div>
</div>
<script src="../assets/js/config.js"></script>
<script>
const A=window.API,$=s=>document.querySelector(s);
const TABS={leads:"Заявки",works:"Работы",prices:"Цены",reviews:"Отзывы",contacts:"Контакты"};
const ST={real:"Реализм",graph:"Графика",mini:"Минимализм",orig:"Ориджинал",cover:"Кавер"};
const LS={new:"🆕 Новая",work:"⏳ В работе",done:"✅ Завершена",no:"🚫 Отклонена"};
const SC={prices:[["name","Услуга"],["note","Пояснение"],["price","Цена"]],
works:[["img","Фото (путь или https://)"],["title","Название"],["style","Стиль","sel"],["featured","На главной","chk"]],
reviews:[["name","Имя"],["stars","Оценка 1–5"],["text","Текст отзыва","txt"]]};
const CF=[["phone","Телефон"],["telegram","Telegram"],["email","E-mail"],["address","Адрес"],["hours","График работы"]];
let D,tab="leads",dirty=false,tok=sessionStorage.getItem("tk");
const mark=()=>{dirty=true;$("#st").textContent="Есть несохранённые изменения"};
addEventListener("beforeunload",e=>{if(dirty)e.preventDefault()});
async function api(p,o={}){const r=await fetch(A+p,{...o,headers:{"content-type":"application/json",authorization:"Bearer "+tok}});
if(r.status===401){out();throw 0}if(!r.ok)throw 1;return r.json()}
function el(t,a={},...k){const n=document.createElement(t);Object.assign(n,a);n.append(...k);return n}
function fld(o,[k,l,t]){const lab=el("label",{},l);let i;
if(t==="chk"){lab.className="ck";i=el("input",{type:"checkbox",checked:!!o[k]});i.onchange=()=>{o[k]=i.checked;mark()};lab.prepend(i);return lab}
if(t==="sel"){i=el("select");Object.entries(ST).forEach(([v,n])=>i.append(el("option",{value:v,textContent:n})));i.value=o[k]}
else{i=el(t==="txt"?"textarea":"input",{value:o[k]??""});if(t==="txt")i.rows=3}
i.oninput=i.onchange=()=>{o[k]=i.value;mark()};lab.append(i);return lab}
function list(key){const box=el("div",{className:"fm"});
const draw=()=>box.replaceChildren(...D[key].map((o,i)=>{const r=el("div",{className:"row"});SC[key].forEach(f=>r.append(fld(o,f)));
r.append(el("button",{className:"btn btn--s btn--g",type:"button",textContent:"✕",title:"Удалить",onclick:()=>{if(confirm("Удалить запись?")){D[key].splice(i,1);mark();draw()}}}));return r}),
el("button",{className:"btn btn--s",type:"button",textContent:"+ Добавить",onclick:()=>{D[key].push(Object.fromEntries(SC[key].map(([k,,t])=>[k,t==="chk"?false:t==="sel"?"orig":k==="stars"?"5":""])));mark();draw()}}));
draw();return box}
async function leads(){const a=await api("/api/admin/leads"),t=el("table");
t.append(el("tr",{},...["Дата","Имя","Телефон","Зона","Сообщение","Статус"].map(h=>el("th",{textContent:h}))));
a.forEach(l=>t.append(el("tr",{},...[new Date(l.id).toLocaleString("ru-RU"),l.name,l.tel,l.zone,l.msg,LS[l.status]].map(v=>el("td",{textContent:v||"—"})))));
return a.length?t:el("p",{textContent:"Заявок пока нет."})}
async function show(){$("#tabs").replaceChildren(...Object.entries(TABS).map(([k,v])=>el("button",{type:"button",textContent:v,"aria-pressed":String(k===tab),onclick:()=>{tab=k;show()}})));
const p=$("#pane");p.replaceChildren();
if(tab==="leads")p.append(await leads());
else if(tab==="contacts"){const f=el("div",{className:"fm"});CF.forEach(x=>f.append(fld(D.contacts,x)));
const lab=el("label",{className:"ck"},el("input",{type:"checkbox",checked:D.open,onchange:e=>{D.open=e.target.checked;mark()}}),"Запись открыта (если выключить, на сайте появится баннер)");f.append(lab);p.append(f)}
else p.append(list(tab))}
async function start(){try{D=await api("/api/admin/content");$("#login").hidden=true;$("#app").hidden=false;await show()}catch{}}
function out(){sessionStorage.removeItem("tk");tok=null;$("#app").hidden=true;$("#login").hidden=false}
$("#lf").onsubmit=async e=>{e.preventDefault();$("#le").textContent="";
try{const r=await fetch(A+"/api/admin/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:$("#pw").value})}),d=await r.json();
if(!r.ok)throw d;tok=d.token;sessionStorage.setItem("tk",tok);$("#pw").value="";start()}catch(x){$("#le").textContent=x.error||"Ошибка входа"}};
$("#save").onclick=async()=>{try{await api("/api/admin/content",{method:"PUT",body:JSON.stringify(D)});dirty=false;$("#st").textContent="Сохранено. На сайте обновится в течение минуты"}catch{$("#st").textContent="Не удалось сохранить"}};
$("#out").onclick=out;
if(!A)$("#le").textContent="Укажите адрес Worker в assets/js/config.js";else if(tok)start();
</script>
</body>
</html>
